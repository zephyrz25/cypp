
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are we okay?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #f5e7ff, #e5f1ff);
            overflow: hidden;
            color: #493746;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 50px 30px;
            border-radius: 25px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .heart {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            color: #927b8e;
            margin-bottom: 35px;
        }

        button {
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #yes {
            background: #ee78a5;
            color: white;
        }

        #no {
            background: #f2e8f0;
            color: #795c74;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        #message {
            display: none;
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #e65d93;
        }

        .confetti {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 15px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        @keyframes pulse {
            50% {
                transform: scale(1.2);
            }
        }

        .heart {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="heart">💗</div>

        <h1>Are we okay?</h1>
        <p>Please choose carefully hehe.</p>

        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>

        <div id="message">
            YAYYY!! 💖🎉
        </div>
    </div>

    <script>
        const yesButton = document.getElementById("yes");
        const noButton = document.getElementById("no");
        const message = document.getElementById("message");

        // Make the NO button dodge
        function dodgeNo() {
            const maxX = window.innerWidth - noButton.offsetWidth;
            const maxY = window.innerHeight - noButton.offsetHeight;

            noButton.style.position = "fixed";
            noButton.style.left = Math.random() * maxX + "px";
            noButton.style.top = Math.random() * maxY + "px";
        }

        noButton.addEventListener("mouseenter", dodgeNo);

        noButton.addEventListener("click", dodgeNo);

        noButton.addEventListener("touchstart", function(e) {
            e.preventDefault();
            dodgeNo();
        });

        // YES button celebration
        yesButton.addEventListener("click", function() {
            message.style.display = "block";

            yesButton.textContent = "YAY!! 💗";
            noButton.style.display = "none";

            document.querySelector(".heart").textContent = "🥰";

            // Generate confetti
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement("span");

                confetti.classList.add("confetti");

                confetti.style.left = Math.random() * 100 + "vw";

                confetti.style.backgroundColor = [
                    "#ff6f9f",
                    "#ffd166",
                    "#9b8cff",
                    "#7bdff2",
                    "#b8f2a1"
                ][Math.floor(Math.random() * 5)];

                confetti.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 6000);
            }
        });
    </script>

</body>
</html>
